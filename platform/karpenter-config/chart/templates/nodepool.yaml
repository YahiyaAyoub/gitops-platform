apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.nodePool.name }}
spec:
  template:
    spec:
      nodeClassRef: { group: karpenter.kwok.sh, kind: KWOKNodeClass, name: default }
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
        - { key: kubernetes.io/os, operator: In, values: ["linux"] }
        - { key: karpenter.sh/capacity-type, operator: In, values: {{ toJson .Values.nodePool.capacityTypes }} }
        - { key: karpenter.kwok.sh/instance-cpu, operator: In, values: {{ toJson .Values.nodePool.allowedInstanceCPUs }} }
      taints:
        - { key: simulated, value: "true", effect: NoSchedule }   # only workloads that opt in land here
      expireAfter: {{ .Values.nodePool.expireAfter }}
  limits:
    cpu: {{ .Values.nodePool.limits.cpu | quote }}
    memory: {{ .Values.nodePool.limits.memory }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ .Values.nodePool.consolidateAfter }}
    budgets:
      - nodes: {{ .Values.nodePool.disruptionBudgetNodes | quote }}
