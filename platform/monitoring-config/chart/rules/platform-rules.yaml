apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-rules
spec:
  groups:
    - name: app-health
      rules:
        - alert: AppPodCrashLooping
          expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", namespace!~"kube-system|monitoring"}) == 1
          for: 1m
          labels: { severity: warning, team: app }
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} (container {{ $labels.container }}) is crash-looping"
        - alert: PodsStuckPending
          expr: sum by (namespace) (kube_pod_status_phase{phase="Pending", namespace!~"kube-system|monitoring"}) > 0
          for: 2m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "{{ $value }} pod(s) stuck Pending in namespace {{ $labels.namespace }} for >2m"
    - name: autoscaling
      rules:
        - alert: KedaScalerErrors
          expr: sum by (exported_namespace, scaledObject, scaler) (increase(keda_scaler_detail_errors_total[2m])) > 0
          for: 1m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "KEDA scaler {{ $labels.scaler }} for ScaledObject {{ $labels.exported_namespace }}/{{ $labels.scaledObject }} is erroring"
        - alert: KarpenterNodePoolNearLimit
          expr: karpenter_nodepools_usage{resource_type="cpu"} / karpenter_nodepools_limit{resource_type="cpu"} > 0.8
          for: 1m
          labels: { severity: warning, team: platform }
          annotations:
            summary: "NodePool {{ $labels.nodepool }} at {{ $value | humanizePercentage }} of its CPU limit (cost guardrail)"
