# Hub add-on: decrypts hub-scoped SopsSecrets (e.g. Argo CD notifications webhook) with the hub age key
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-sops-secrets-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://isindir.github.io/sops-secrets-operator/
      chart: sops-secrets-operator
      targetRevision: 0.28.1
      helm:
        releaseName: sops-secrets-operator
        valueFiles:
          - $values/platform/sops-secrets-operator/values.yaml
    - repoURL: https://github.com/YahiyaAyoub/gitops-platform.git
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: sops-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
