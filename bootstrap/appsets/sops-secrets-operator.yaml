# Platform add-on: auto-synced on all target clusters (apps are promotion-gated, add-ons are not)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sops-secrets-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: In, values: [dev, prod] }
  template:
    metadata:
      name: 'sops-secrets-operator-{{ .name }}'
    spec:
      project: default
      sources:
        - repoURL: https://isindir.github.io/sops-secrets-operator/
          chart: sops-secrets-operator
          targetRevision: 0.28.1
          helm:
            releaseName: sops-secrets-operator
            valueFiles:
              - $values/platform/sops-secrets-operator/values.yaml
        - repoURL: https://github.com/YahiyaAyoub/gitops-platform.git
          targetRevision: main
          ref: values
      destination:
        name: '{{ .name }}'
        namespace: sops-system
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
