# Hub: Argo CD Notifications config (ConfigMap) + encrypted Slack webhook (SopsSecret), managed from git
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-notifications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YahiyaAyoub/gitops-platform.git
    targetRevision: main
    path: platform/hub-notifications
    directory: { recurse: true }
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
