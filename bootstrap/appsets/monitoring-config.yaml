apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-config
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: In, values: [dev, prod] }
            - { key: monitoring, operator: NotIn, values: [disabled] }
  template:
    metadata:
      name: 'monitoring-config-{{ .name }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/YahiyaAyoub/gitops-platform.git
        targetRevision: main
        path: platform/monitoring-config/chart
        helm:
          parameters:
            - { name: env, value: '{{ index .metadata.labels "env" }}' }
      destination:
        name: '{{ .name }}'
        namespace: monitoring
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
