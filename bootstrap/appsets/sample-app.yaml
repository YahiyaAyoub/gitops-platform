apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true   # blast-radius guard: deleting the AppSet never deletes workloads
  generators:
    - clusters:
        selector:
          matchExpressions:
            - { key: env, operator: In, values: [dev, prod] }
  template:
    metadata:
      name: 'sample-app-{{ .name }}'
      labels:
        env: '{{ index .metadata.labels "env" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/YahiyaAyoub/gitops-platform.git
        targetRevision: main
        path: apps/sample-app/chart
        helm:
          releaseName: sample-app
          ignoreMissingValueFiles: true
          valueFiles:                                   # precedence: last wins
            - ../values/values-common.yaml
            - '../values/env/values-{{ index .metadata.labels "env" }}.yaml'
            - '../values/clusters/values-{{ .name }}.yaml'
          parameters:
            - { name: clusterName, value: '{{ .name }}' }
            - { name: env, value: '{{ index .metadata.labels "env" }}' }
      destination:
        name: '{{ .name }}'
        namespace: sample-app
      syncPolicy:
        syncOptions: [CreateNamespace=true]
  templatePatch: |
    {{- if eq (index .metadata.labels "env") "dev" }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
