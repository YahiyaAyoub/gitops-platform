# Task 1: one Application per cluster (deliberate copy-paste, replaced by ApplicationSet in Task 2)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YahiyaAyoub/gitops-platform.git
    targetRevision: main
    path: apps/sample-app/chart
    helm:
      releaseName: sample-app
      valueFiles:
        - ../values/values-common.yaml
      parameters:
        - { name: clusterName, value: prod }
        - { name: env, value: prod }
  destination:
    name: prod
    namespace: sample-app
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
